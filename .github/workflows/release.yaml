name: Release

# Opens a draft release when manifest.json's version changes on main. The logic
# lives in eklundjon/ha-workflows; see its README for the release convention.

on:
  push:
    branches: [main]
    paths: ["custom_components/ecowitt_hp2550/manifest.json"]
  workflow_dispatch:

jobs:
  release:
    uses: eklundjon/ha-workflows/.github/workflows/release.yml@v1.0.0
    permissions:
      contents: write
