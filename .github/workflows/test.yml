name: Tests

# ruff, then pytest against Home Assistant 2025.4 (hacs.json's minimum) and the
# latest. The jobs live in eklundjon/ha-workflows. Checks report as
# "test / ruff", "test / HA 2025.4 (minimum)" and "test / HA latest".

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: eklundjon/ha-workflows/.github/workflows/test.yml@v1.0.0
    with:
      coverage: 80
